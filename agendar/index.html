<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agende uma apresentação | UNIC</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(ellipse at top right,#104459,#03121b 55%,#020609);color:#fff5e8;font:16px system-ui}main{width:min(92%,460px);padding:32px;border:1px solid #347082;border-radius:20px;background:#071c26}img{width:100%}h1{font:36px Georgia;margin:12px 0}p{line-height:1.6;color:#c9d8df}label{display:block;margin:18px 0 6px}input,button{width:100%;padding:15px;border-radius:8px;font:inherit}input{background:#04121a;color:white;border:1px solid #50717d}button{margin-top:22px;background:#efc18c;color:#17120c;border:0;font-weight:bold;cursor:pointer}small{color:#b8cbd2}#message{color:#ffe0b7}</style><main><img src="/assets/LOGO%20PNG.png" alt="UNIC"><h1>Conheça a UNIC de perto.</h1><p>Solicite uma apresentação personalizada. Nossa equipe entrará em contato para agendar o melhor dia e horário.</p><form id="form"><label for="name">Nome completo</label><input id="name" name="name" autocomplete="name" required maxlength="150"><label for="phone">Telefone / WhatsApp</label><input id="phone" name="phone" type="tel" autocomplete="tel" required maxlength="25"><button>Solicitar apresentação</button><p><small>Seus dados serão utilizados para contato e agendamento.</small></p></form><p id="message" role="status"></p></main><script>const f=document.querySelector('form'),m=document.querySelector('#message'),b=f.querySelector('button');f.onsubmit=async e=>{e.preventDefault();b.disabled=true;m.textContent='Enviando...';try{const r=await fetch('https://clinic-saas-api-prod.onrender.com/api/demo-requests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))});if(!r.ok || (await r.json()).success !== true)throw Error();f.hidden=true;m.textContent='Obrigado pelo seu interesse! Nossa equipe entrará em contato para agendar o melhor dia e horário.'}catch{m.textContent='Não foi possível enviar. Confira o telefone e tente novamente.';b.disabled=false}};</script></html>
