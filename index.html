<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNIC — One Clinic. One System.</title><style>
*{box-sizing:border-box}body{margin:0;background:#090a0d;color:#f5f2ee;font-family:Inter,system-ui,sans-serif;overflow:hidden}main{height:100dvh;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 110%,#50321f 0%,#171313 30%,#090a0d 65%)}header{position:fixed;z-index:5;top:24px;left:5vw;right:5vw;display:flex;align-items:center;justify-content:space-between}header img{width:180px;height:52px;object-fit:cover;object-position:center 43%;border-radius:8px}header a{color:#d9b89e;font-size:13px;text-decoration:none}.scene{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:100px 72px 130px;transition:transform .85s cubic-bezier(.22,.8,.2,1),opacity .65s;}.scene h1{font-size:clamp(30px,5vw,76px);font-weight:500;letter-spacing:-.055em;line-height:1.13;max-width:1050px;margin:0 auto}.scene h1 span{display:block;color:#d6a780;margin-top:22px}.wrong{transform:translateY(100%);opacity:0}.wrong h2{font-size:clamp(28px,4vw,60px);font-weight:500;letter-spacing:-.04em;margin:0}.wrong p{font-size:clamp(17px,2vw,26px);max-width:720px;color:#c9c3bd}.wrong button{margin:20px auto;color:#efb07f;background:none;border:0;font:inherit;cursor:pointer;padding:12px}.is-wrong .opening{transform:translateY(-100%);opacity:0}.is-wrong .wrong{transform:none;opacity:1}.horizon{position:absolute;bottom:0;left:0;width:100%;height:24%;pointer-events:none;transition:opacity .5s}.is-wrong .horizon{opacity:0}.controls{position:fixed;right:24px;top:50%;transform:translateY(-50%);display:grid;gap:10px;z-index:6}.controls button{border:1px solid #ffffff30;background:#141316;color:#e4b996;border-radius:50%;width:46px;height:46px;font-size:23px;cursor:pointer}.controls button:disabled{opacity:.3;cursor:default}footer{position:fixed;bottom:24px;left:5vw;color:#a49a91;font-size:11px;letter-spacing:.15em}button:focus-visible,a:focus-visible{outline:2px solid #efb07f;outline-offset:4px}@media(max-width:600px){.scene{padding:100px 48px 100px 22px}.controls{right:8px}.controls button{width:34px;height:34px}header img{width:145px;height:45px}}@media(prefers-reduced-motion:reduce){.scene,.horizon{transition:none}}
</style></head><body><main id="experience"><header><img src="assets/unic-original.png" alt="UNIC"><a href="mailto:contato@unic.com.br">Contato</a></header><section class="scene opening" id="opening"><h1>Não adaptamos um sistema para a cirurgia plástica.<span>Nós criamos um sistema para ela.</span></h1></section><section class="scene wrong" id="wrong" inert aria-hidden="true"><h2>Ops, você está indo na direção errada.</h2><p>A UNIC é o único sistema que leva sua clínica para cima.</p><button id="try">Experimente subir. ↑</button></section><svg class="horizon" viewBox="0 0 1200 220" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="g"><stop stop-color="#d9874f" stop-opacity="0"/><stop offset=".5" stop-color="#efb07f" stop-opacity=".8"/><stop offset="1" stop-color="#d9874f" stop-opacity="0"/></linearGradient></defs><path d="M0 220 Q600 -110 1200 220" fill="none" stroke="url(#g)" stroke-width="1.2"/></svg><nav class="controls" aria-label="Navegação"><button id="up" aria-label="Subir" disabled>↑</button><button id="down" aria-label="Descer">↓</button></nav><footer>ONE CLINIC. ONE SYSTEM.</footer></main><script>
const root=document.getElementById('experience'),opening=document.getElementById('opening'),wrong=document.getElementById('wrong'),up=document.getElementById('up'),down=document.getElementById('down');let state=false,last=0,start=null;function go(v){if(v===state)return;state=v;root.classList.toggle('is-wrong',v);opening.inert=v;wrong.inert=!v;opening.setAttribute('aria-hidden',String(v));wrong.setAttribute('aria-hidden',String(!v));up.disabled=!v;down.disabled=v}up.onclick=()=>go(false);down.onclick=()=>go(true);document.getElementById('try').onclick=()=>go(false);addEventListener('wheel',e=>{e.preventDefault();if(Math.abs(e.deltaY)<12||Date.now()-last<900)return;last=Date.now();go(e.deltaY>0)},{passive:false});addEventListener('keydown',e=>{if(['ArrowDown','PageDown','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(['ArrowDown','PageDown'].includes(e.key))}});addEventListener('touchstart',e=>start=e.touches[0].clientY,{passive:true});addEventListener('touchend',e=>{if(start===null)return;const d=start-e.changedTouches[0].clientY;start=null;if(Math.abs(d)>45)go(d>0)},{passive:true});
</script></body></html>
