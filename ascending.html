<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>UNIC — Ascending Experience</title><style>
*{box-sizing:border-box}body{margin:0;background:#101820;color:#f4f2ed;font:16px system-ui,sans-serif;overflow:hidden}main{position:relative;height:100dvh;overflow:hidden;touch-action:pan-x}.scene{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:70px 48px;transition:transform .85s cubic-bezier(.2,.75,.2,1),opacity .6s; background:radial-gradient(ellipse at 50% 90%,#29434a 0%,#101820 65%)}.scene[data-position="above"]{transform:translateY(-100%);opacity:0;pointer-events:none}.scene[data-position="below"]{transform:translateY(100%);opacity:0;pointer-events:none}h1{font-size:clamp(36px,7vw,96px);letter-spacing:-.055em;line-height:1.02;font-weight:500;max-width:1000px;margin:24px auto}p{color:#c0cfce;line-height:1.6;max-width:600px;margin:12px auto}.eyebrow{font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:#a7c7c1}header,footer{position:fixed;z-index:3;left:clamp(20px,5vw,70px);right:clamp(20px,5vw,70px);display:flex;justify-content:space-between;align-items:center}header{top:28px}footer{bottom:24px}.brand{font-size:32px;font-weight:650;letter-spacing:-.08em}button{font:inherit;color:inherit;background:#ffffff08;border:1px solid #ffffff35;border-radius:100px;cursor:pointer;padding:12px 20px}button:hover,button:focus-visible{background:#ffffff20}button:disabled{opacity:.3;cursor:default}nav{position:fixed;right:18px;top:50%;transform:translateY(-50%);display:grid;gap:8px;z-index:4}nav button{width:42px;height:42px;padding:0}.cta{margin:28px auto 0}.notice{min-height:3em;font-size:13px}a{color:inherit}@media(max-width:600px){.scene{padding:65px 52px 65px 24px}footer{font-size:10px}nav{right:8px}}@media(prefers-reduced-motion:reduce){.scene{transition:none}}
</style></head><body><header><span class="brand">unic.</span><a href="./index.html">Site atual</a></header><main id="experience"><section class="scene" data-position="current"><span class="eyebrow">Uma nova perspectiva</span><h1>Toda clínica tem um próximo nível.</h1><p>O seu começa aqui.</p><button class="cta" data-up>Experimente subir ↑</button><p class="notice" id="notice" role="status"></p></section><section class="scene" data-position="above" inert aria-hidden="true"><span class="eyebrow">One clinic. One system.</span><h1>O futuro da sua clínica está acima.</h1><p>Tudo o que sua clínica precisa. Em um só lugar.</p><button class="cta" data-down>Voltar ↓</button></section></main><nav aria-label="Navegação entre capítulos"><button data-up aria-label="Subir">↑</button><button data-down aria-label="Descer">↓</button></nav><footer><span class="eyebrow">Ascending experience</span><span id="progress" aria-live="polite">01 / 02</span></footer><script>
const scenes=[...document.querySelectorAll('.scene')];let current=0,last=0,start=null;const notice=document.querySelector('#notice');function render(){scenes.forEach((s,i)=>{s.dataset.position=i===current?'current':i>current?'above':'below';s.inert=i!==current;s.setAttribute('aria-hidden',String(i!==current))});document.querySelector('#progress').textContent=String(current+1).padStart(2,'0')+' / 02';document.querySelectorAll('[data-up]').forEach(b=>b.disabled=current===1);document.querySelectorAll('[data-down]').forEach(b=>b.disabled=false)}function move(d){if(d<0&&current===0){notice.textContent='Ops, você está indo na direção errada. A UNIC é o único sistema que leva a sua clínica para cima. Experimente subir.';return}if(current+d<0||current+d>=scenes.length||Date.now()-last<900)return;last=Date.now();current+=d;notice.textContent='';render()}document.querySelectorAll('[data-up]').forEach(b=>b.addEventListener('click',()=>move(1)));document.querySelectorAll('[data-down]').forEach(b=>b.addEventListener('click',()=>move(-1)));window.addEventListener('wheel',e=>{if(e.ctrlKey)return;e.preventDefault();if(Math.abs(e.deltaY)>8)move(e.deltaY<0?1:-1)},{passive:false});window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','PageUp','PageDown'].includes(e.key)){e.preventDefault();move(['ArrowUp','PageUp'].includes(e.key)?1:-1)}});const main=document.querySelector('main');main.addEventListener('touchstart',e=>{start=e.touches[0].clientY},{passive:true});main.addEventListener('touchend',e=>{if(start===null)return;const delta=e.changedTouches[0].clientY-start;start=null;if(Math.abs(delta)>45)move(delta>0?1:-1)},{passive:true});render();
</script></body></html>
